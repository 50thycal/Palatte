# Key Palette's Xcode project, generated by XcodeGen (`xcodegen generate`); the
# .xcodeproj itself isn't committed. Needs no Apple account to build for the
# simulator. To run on a phone, set DEVELOPMENT_TEAM below (or in Xcode) once
# an Apple Developer account exists, and register the two bundle ids and the
# App Group.
name: KeyPalette
options:
  bundleIdPrefix: com.appfarm
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
packages:
  KeyPaletteKit:
    path: .
targets:
  KeyPalette:
    type: application
    platform: iOS
    sources:
      - path: App
      # The word list and the bundled profiles, kept as a folder so the paths stay.
      # Not named "Resources": a root-level Resources folder makes Apple's bundle code
      # look for Resources/Info.plist, and the extension fails validation.
      - path: Data
        type: folder
    dependencies:
      - target: KeyPaletteKeyboard
      - package: KeyPaletteKit
        product: KeyPaletteCore
      - package: KeyPaletteKit
        product: KeyPaletteUI
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Key Palette
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    entitlements:
      path: App/KeyPalette.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.appfarm.keypalette
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.appfarm.keypalette
  KeyPaletteKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - path: Keyboard
      - path: Data
        type: folder
    dependencies:
      - package: KeyPaletteKit
        product: KeyPaletteCore
      - package: KeyPaletteKit
        product: KeyPaletteUI
    info:
      path: Keyboard/Info.plist
      properties:
        CFBundleDisplayName: Key Palette
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
          NSExtensionAttributes:
            IsASCIICapable: true
            PrimaryLanguage: en-US
            # Everything works without Full Access: nothing leaves the phone
            RequestsOpenAccess: false
    entitlements:
      path: Keyboard/Keyboard.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.appfarm.keypalette
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.appfarm.keypalette.keyboard
schemes:
  KeyPalette:
    build:
      targets:
        KeyPalette: all
        KeyPaletteKeyboard: all
    run:
      config: Debug
