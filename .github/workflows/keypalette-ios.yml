name: Key Palette iOS

# Tests the keyboard engine and compiles the app and its keyboard extension for
# the simulator, unsigned: no Apple account or secrets needed. Signing,
# TestFlight and the App Store come later, when there is a developer account.

on:
  pull_request:
    paths:
      - 'keypalette/**'
      - '.github/workflows/keypalette-ios.yml'
  push:
    branches: [claude/build-palate-app-jAX5x]
    paths:
      - 'keypalette/**'
      - '.github/workflows/keypalette-ios.yml'
  workflow_dispatch:

concurrency:
  group: keypalette-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40
    defaults:
      run:
        working-directory: keypalette
    steps:
      - uses: actions/checkout@v4
      - name: Engine tests
        run: swift test
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate the Xcode project
        run: xcodegen generate
      - name: Build the app and the keyboard (simulator, unsigned)
        run: |
          xcodebuild -project KeyPalette.xcodeproj -scheme KeyPalette -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build > "$RUNNER_TEMP/xcodebuild.log" 2>&1 \
            && status=0 || status=$?
          echo "xcodebuild exit status: $status"
          # The full log is huge: show only what matters
          grep -nE "error:|warning: .*(Info|plist)|BUILD (SUCCEEDED|FAILED)" "$RUNNER_TEMP/xcodebuild.log" | cut -c1-300 | head -40 || true
          if [ "$status" != 0 ]; then
            echo "--- Info.plist steps for the keyboard"
            grep -n "ProcessInfoPlistFile.*KeyPaletteKeyboard" "$RUNNER_TEMP/xcodebuild.log" | cut -c1-400 | head -10 || true
            echo "--- built extension folders"
            find "$HOME/Library/Developer/Xcode/DerivedData" -name "KeyPaletteKeyboard.appex" -maxdepth 7 | while read -r d; do echo "$d"; ls -la "$d" | head -20; done
            echo "--- the keyboard's generated Info.plist (source)"
            cat Keyboard/Info.plist
            echo "--- the built extension's Info.plist"
            APPEX=$(find "$HOME/Library/Developer/Xcode/DerivedData" -path "*Debug-iphonesimulator/KeyPalette.app/PlugIns/KeyPaletteKeyboard.appex" -maxdepth 8 | head -1)
            plutil -lint "$APPEX/Info.plist" || true
            plutil -p "$APPEX/Info.plist" || true
            exit "$status"
          fi
      - name: The keyboard extension is inside the app
        run: |
          APP=$(find ~/Library/Developer/Xcode/DerivedData -path '*Debug-iphonesimulator/KeyPalette.app' -maxdepth 6 | head -1)
          echo "$APP"
          test -d "$APP/PlugIns/KeyPaletteKeyboard.appex"
          plutil -p "$APP/PlugIns/KeyPaletteKeyboard.appex/Info.plist" | grep -E "keyboard-service|RequestsOpenAccess|PrimaryLanguage"
          test -f "$APP/Resources/words-en.txt"
          test -f "$APP/Resources/profiles/cargo-ship.json"
      - name: Speed budget (release build)
        # Autocorrect runs on every keystroke: a correction must stay under 15 ms
        # in the optimised build that ships.
        run: swift test -c release -Xswiftc -enable-testing --filter testCorrectionIsFast
